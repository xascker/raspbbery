apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      nodeSelector:
        kubernetes.io/hostname: pi4-8g-worker1

      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434

          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"

          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama

      volumes:
        - name: ollama-data
          emptyDir: { }

---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ai
spec:
  type: NodePort
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
      nodePort: 31434